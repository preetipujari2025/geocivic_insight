<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GeoCivic Insight — View your constituency on the map and find your representatives.">
    <title>Your Constituency — GeoCivic Insight</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f1117;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: rgba(15, 17, 23, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            z-index: 1000;
            position: relative;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            color: #9ca3af;
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }

        .top-bar-title {
            font-size: 1rem;
            font-weight: 600;
            color: #e5e7eb;
        }

        /* Map Container */
        .map-wrapper {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #map {
            width: 100%;
            height: 80vh;
            z-index: 1;
        }

        /* Loading Overlay */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 17, 23, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            z-index: 500;
            transition: opacity 0.4s ease;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(34, 197, 94, 0.15);
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #9ca3af;
            letter-spacing: 0.5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error Overlay */
        #error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 17, 23, 0.92);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            z-index: 500;
        }

        #error-overlay.visible {
            display: flex;
        }

        .error-icon {
            font-size: 2.5rem;
        }

        .error-message {
            font-size: 1rem;
            color: #ef4444;
            font-weight: 500;
            text-align: center;
            max-width: 400px;
        }

        .error-home-link {
            margin-top: 0.5rem;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .error-home-link:hover {
            background: rgba(34, 197, 94, 0.2);
        }

        /* Constituency Preview Card */
        #constituency-preview {
            display: none;
            padding: 1.25rem 1.5rem;
            background: rgba(15, 17, 23, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            animation: slideUp 0.4s ease;
        }

        #constituency-preview.visible {
            display: block;
        }

        .preview-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .preview-info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .preview-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #22c55e;
        }

        .preview-badge::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .preview-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
        }

        .preview-district {
            font-size: 0.85rem;
            color: #6b7280;
            font-weight: 400;
        }

        .view-leaders-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: #0f1117;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.25);
            white-space: nowrap;
        }

        .view-leaders-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 30px rgba(34, 197, 94, 0.4);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Leaflet dark theme overrides */
        .leaflet-container {
            background: #1a1d27;
        }

        .leaflet-control-zoom a {
            background: #1e2130 !important;
            color: #9ca3af !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        .leaflet-control-zoom a:hover {
            background: #2a2d3a !important;
            color: #22c55e !important;
        }

        .leaflet-control-attribution {
            background: rgba(15, 17, 23, 0.8) !important;
            color: #4b5563 !important;
            font-size: 0.65rem !important;
        }

        .leaflet-control-attribution a {
            color: #6b7280 !important;
        }

        /* Mobile responsive */
        @media (max-width: 640px) {
            #map {
                height: 70vh;
            }

            .preview-content {
                flex-direction: column;
                text-align: center;
            }

            .preview-info {
                align-items: center;
            }

            .view-leaders-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <nav class="top-bar">
        <a href="index.html" class="back-link" title="Back to Home">←</a>
        <span class="top-bar-title">Your Constituency</span>
    </nav>

    <!-- Map Area -->
    <div class="map-wrapper">
        <div id="map"></div>

        <!-- Loading Overlay -->
        <div id="loading-overlay">
            <div class="loading-spinner"></div>
            <p class="loading-text">Finding your constituency...</p>
        </div>

        <!-- Error Overlay -->
        <div id="error-overlay">
            <span class="error-icon">⚠️</span>
            <p id="error-message" class="error-message"></p>
            <a href="index.html" class="error-home-link">← Back to Home</a>
        </div>
    </div>

    <!-- Constituency Preview Card -->
    <div id="constituency-preview">
        <div class="preview-content">
            <div class="preview-info">
                <span class="preview-badge">Constituency Found</span>
                <h2 id="preview-name" class="preview-name"></h2>
                <p id="preview-district" class="preview-district"></p>
            </div>
            <a href="results.html" class="view-leaders-btn" id="view-leaders-btn">
                View Leader Profiles →
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/geo.js"></script>
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
